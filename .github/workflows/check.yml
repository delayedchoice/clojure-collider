name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: 1.12.4
      - name: Install SuperCollider (scsynth only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq supercollider-server
          scsynth -v
      - run: make check
